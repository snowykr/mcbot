[server]
version = "1.20.1"
type = "FORGE"
difficulty = "easy"
memory = "14G"
init_memory = "14G"
motd = "SNOWY'S SERVER"
view_distance = 8
simulation_distance = 8

[container]
restart_policy = "no"
port_publish = "25565:25565"
uid = 1000
gid = 1000

[backup]
enabled = true
directory = "backups"
retention_count = 14
retention_days = 0
retention_max_bytes = 0
daily_time = "04:00"
timezone = "Local"
quiesce_timeout_seconds = 30
include_mc_server_toml = true
