services:
  mcbot:
    build:
      context: ./mcbot
      dockerfile: Dockerfile
    container_name: mcbot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MC_CONTAINER_NAME: stardew_create_forge_server
      MCBOT_ROLE_NAME: 마크봇
      READY_LOG_PATTERN: "Dedicated server took"
      READY_TIMEOUT_SECONDS: "600"
      STOP_TIMEOUT_SECONDS: "120"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  mc-server:
    image: itzg/minecraft-server
    container_name: stardew_create_forge_server
    tty: true
    stdin_open: true
    restart: "no"
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"
      VERSION: "1.20.1"
      TYPE: "FORGE"  # Forge로 변경
      
      # --- 성능 최적화 (M3 Pro) ---
      MEMORY: "14G"
      INIT_MEMORY: "6G"
      USE_AIKAR_FLAGS: "true"
      # --- 게임 설정 ---
      view-distance: 10
      simulation-distance: 10
      MOTD: "Stardew x Create (Forge Server)"
      
    volumes:
      - ./data:/data

