services:
  mcbot:
    build:
      context: ./mcbot
      dockerfile: Dockerfile
    container_name: mcbot
    restart: unless-stopped
    command: ["bot", "run"]
    env_file:
      - .env
    environment:
      MC_CONTAINER_NAME: ${MC_CONTAINER_NAME:-mc-server}
      MCBOT_ROLE_NAME: ${MCBOT_ROLE_NAME:-마크봇}
      READY_TIMEOUT_SECONDS: "${READY_TIMEOUT_SECONDS:-600}"
      STOP_TIMEOUT_SECONDS: "${STOP_TIMEOUT_SECONDS:-120}"
      RCON_PORT:
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Keep bot runtime state separate from game data so backups stay game-only.
      - ./data/mcbot:/app/data/mcbot
      - ./data/minecraft:/app/data/minecraft:ro
      - ./backups:/app/backups
      - ./mc-server.toml:/app/mc-server.toml:ro

  mc-server:
    image: itzg/minecraft-server
    container_name: ${MC_CONTAINER_NAME:-mc-server}
    # Reap short-lived helpers such as rcon-cmds-daemon when RCON_CMDS_STARTUP is used.
    init: true
    tty: true
    stdin_open: true
    restart: "${MC_SERVER_RESTART_POLICY:-no}"
    ports:
      - "${MC_SERVER_PORT_PUBLISH:-25565:25565}"
    environment:
      EULA: "TRUE"
      UID: "${UID:-1000}"
      GID: "${GID:-1000}"
      VERSION: "${VERSION:-1.20.1}"
      TYPE: "${TYPE:-FORGE}"
      DIFFICULTY: "${DIFFICULTY:-easy}"
      MEMORY: "${MEMORY:-14G}"
      INIT_MEMORY: "${INIT_MEMORY:-14G}"
      MOTD: "${MOTD:-SNOWY'S SERVER}"
      VIEW_DISTANCE: "${VIEW_DISTANCE:-8}"
      SIMULATION_DISTANCE: "${SIMULATION_DISTANCE:-8}"
      ENABLE_RCON: "${ENABLE_RCON:-true}"
      USE_AIKAR_FLAGS: "true"
      RCON_PASSWORD:
      RCON_PORT:
      RCON_CMDS_STARTUP:

    volumes:
      - ./data/minecraft:/data

    deploy:
      resources:
        limits:
          memory: 20g
